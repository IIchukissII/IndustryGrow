<svg xmlns="http://www.w3.org/2000/svg" width="720" height="504" viewBox="0 0 720 504" role="img" aria-label="Registration session for the canopy imaging channel, per ADR-0033 decision 12">
  <title>ADR-0033 — establishing registration between the camera and the thermal imager</title>
  <desc>A one-off session and a continuing check. In the session, the instrument housing holds the visible camera and the MLX90640 thermal imager on a short fixed baseline, and both view a registration target carrying nine printed cylinders on one baseplate whose spacings come from its own drawing. The target is captured at many poses spanning the working volume with the luminaire on and settled. Each pose yields a visible frame showing nine discs and a thermal frame showing nine warm blobs, because the cylinders absorb light and rise above air temperature. Solving those correspondences jointly yields the thermal camera's missing lens model, the pose of the camera relative to the imager, the homography at the canopy plane, a parallax bound across the depth range, and residuals over the nine points from which the tolerance is set. Afterwards the small permanent in-frame fiducial is checked at every capture event, so pose drift is detected rather than presumed absent, and a residual past tolerance sends the operator back through the session.</desc>

  <defs>
    <marker id="a33" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5F5E5A"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="503" rx="10" fill="#FFFFFF" stroke="#E5E3DC"/>
  <text x="360" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">Registration between the camera and the thermal imager</text>
  <text x="360" y="47" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">One target both instruments can see, because the cylinders warm under the luminaire</text>

  <!-- ================= band A: the session ================= -->
  <text x="30" y="72" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">ONCE &#8212; PER OPTICAL CONFIGURATION AND PER ASSEMBLY</text>

  <rect x="30" y="82" width="196" height="126" rx="5" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="128" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">instrument housing (d11)</text>
  <rect x="42" y="110" width="172" height="34" rx="4" fill="#FFFFFF" stroke="#C3CBD6"/>
  <text x="128" y="131" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">visible camera (d19)</text>
  <rect x="42" y="152" width="172" height="34" rx="4" fill="#FFFFFF" stroke="#C3CBD6"/>
  <text x="128" y="173" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">MLX90640 (spec/E0005)</text>
  <text x="128" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">baseline short, fixed and known</text>

  <line x1="226" y1="127" x2="392" y2="120" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="226" y1="169" x2="392" y2="206" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>

  <g transform="rotate(-7 500 163)"><rect x="410" y="105" width="180" height="116" rx="5" fill="none" stroke="#C9C6BC" stroke-dasharray="4 3"/></g>
  <g transform="rotate(7 500 163)"><rect x="410" y="105" width="180" height="116" rx="5" fill="none" stroke="#C9C6BC" stroke-dasharray="4 3"/></g>

  <rect x="400" y="105" width="180" height="116" rx="5" fill="#F7F6F2" stroke="#C9C6BC"/>
  <g fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.1">
    <circle cx="432" cy="134" r="9"/><circle cx="490" cy="134" r="9"/><circle cx="548" cy="134" r="9"/>
    <circle cx="432" cy="166" r="9"/><circle cx="490" cy="166" r="9"/><circle cx="548" cy="166" r="9"/>
    <circle cx="432" cy="198" r="9"/><circle cx="490" cy="198" r="9"/><circle cx="548" cy="198" r="9"/>
  </g>
  <text x="490" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">registration target &#8212; nine cylinders, one baseplate</text>
  <text x="490" y="251" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">captured at many poses across the working volume (R2)</text>

  <!-- ================= band B: solve ================= -->
  <rect x="30" y="272" width="190" height="40" rx="4" fill="#F2F4F7" stroke="#C3CBD6"/>
  <text x="125" y="296" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">visible frame &#8212; nine discs</text>
  <rect x="30" y="320" width="190" height="40" rx="4" fill="#FBF1EE" stroke="#E3B6A8"/>
  <text x="125" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">thermal frame &#8212; nine warm blobs</text>

  <line x1="220" y1="292" x2="252" y2="308" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a33)"/>
  <line x1="220" y1="340" x2="252" y2="324" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a33)"/>

  <rect x="258" y="288" width="150" height="56" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="333" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">joint solve (R3)</text>
  <text x="333" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">both models at once</text>

  <line x1="408" y1="316" x2="440" y2="316" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a33)"/>

  <rect x="446" y="266" width="244" height="100" rx="4" fill="#EEF4EE" stroke="#A8C4A8"/>
  <text x="460" y="286" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">thermal lens model &#8212; attacks O-92</text>
  <text x="460" y="303" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">camera-to-imager pose</text>
  <text x="460" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">canopy-plane homography (R4)</text>
  <text x="460" y="337" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">parallax bound across depth (R5)</text>
  <text x="460" y="354" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">residuals set the tolerance (R6)</text>

  <!-- ================= band C: the continuing check ================= -->
  <text x="30" y="404" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">AFTER &#8212; AT EVERY CAPTURE EVENT</text>

  <rect x="30" y="414" width="230" height="42" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="145" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">in-frame fiducial (d9)</text>
  <line x1="260" y1="435" x2="292" y2="435" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a33)"/>
  <rect x="298" y="414" width="392" height="42" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="494" y="432" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">drift detected, not presumed absent</text>
  <text x="494" y="447" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">a residual past tolerance sends the session back through R2 to R6</text>

  <text x="30" y="482" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">R1 precedes the session: focus locked and capture mode fixed, then the visible lens model taken from a chessboard target. Moving focus voids everything downstream.</text>
</svg>
