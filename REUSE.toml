version = 1

# Hardware design files in store/ — KiCad sources (.kicad_sch/.pcb/.pro/.prl/.mod)
# and generated fabrication outputs (gerbers, drill, BOM, placement, render) —
# cannot carry an inline SPDX comment (strict parsers / binary / generated), so
# they are annotated here per the REUSE specification.
#
# precedence = "closest": a store file that DOES carry its own inline SPDX header
# uses that header; only header-less files fall back to this CERN-OHL-S default.
# This lets documentation-layer documents that also live flat in the store under
# the ADR-0017 identifier scheme (e.g. the CC-BY-SA Manual SP0004-M-gateway-bringup.md,
# ADR-0017 d9/d15) carry their own licence, while every hardware design file —
# which cannot hold an inline header — stays CERN-OHL-S.
[[annotations]]
path = "store/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The IndustryGrow contributors"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# Firmware release artifacts (ADR-0017 'F' layer; see REGISTRY.md) are reference
# firmware under AGPL-3.0-or-later (ADR-0002 d5), NOT the CERN-OHL-S hardware
# default above. The .hex/.zip are binary and carry no inline header, so the
# F-layer paths are annotated here and override the store/** default. (Added at
# build time by firmware/tools/release.sh; this rule waits for them.)
[[annotations]]
path = ["store/E0001-*-F*.hex", "store/E0001-*-F*.img", "store/E0001-*-F-src.zip"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The IndustryGrow contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Vendor reference document retained per ADR-0002 rev 3 d4 (REGISTRY.md). Third-party
# content: WeAct publishes it with no licence stated, so it is neither project
# copyright nor CERN-OHL-S and must override the store/** default above.
[[annotations]]
path = "store/SP0005-D-coreboard-snapshot.zip"
precedence = "override"
SPDX-FileCopyrightText = "WeAct Studio"
SPDX-License-Identifier = "LicenseRef-WeAct-unstated"

# Project images/logos, ADR figures, the roadmap figure, and this manifest itself
# (no inline-comment option for the binary PNGs; SVGs kept uniform with them).
[[annotations]]
path = ["img/**", "ADR/figures/**", "project/figures/*.svg", "project/figures/*.png", "REUSE.toml", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The IndustryGrow contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Repo submodule manifest — a list of firmware dependency URLs. The submodule
# contents are gitlinks (not files in this tree) and so are not REUSE-scanned;
# only this manifest needs a licence. Kept inline-header-free as a clean git
# config file and annotated here, like .gitignore above.
[[annotations]]
path = ".gitmodules"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The IndustryGrow contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Cultivation profiles (JSON instances) — strict JSON has no comment syntax for an
# inline SPDX header, so they are annotated here. Profiles are open by default
# (CC-BY-SA 4.0) per ADR-0003.
[[annotations]]
path = "profiles/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The IndustryGrow contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Instance & integration ERP application (ADR-0021) — AGPL-3.0-or-later per
# ADR-0021 decision 14. Source files carry their own inline SPDX header;
# precedence = "closest" lets those win, and header-less files (HTML templates,
# static CSS/JS) fall back to this AGPL default.
[[annotations]]
path = "erp/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The IndustryGrow contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"


# E0010 service tool firmware (ADR-0030, spec/SERVICE-TOOL-specification.md).
# Our own source carries an inline SPDX header; precedence = "closest" lets
# those win and header-less files fall back to this AGPL default, matching the
# reference-firmware licence the F layer already uses (ADR-0002 d5).
[[annotations]]
path = "service-tool/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The IndustryGrow contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# STMicroelectronics files retained from the STM32CubeH7 distribution. Each was
# matched BYTE FOR BYTE against its origin in that distribution and carries the
# licence that origin's own LICENSE.md states -- the licence is not inferred
# from the ST copyright notice, which names no licence at all.
#
# Projects/STM32H747I-EVAL/Templates/** -> BSD-3-Clause: the CubeMX user-code
# templates (interrupt vectors, HAL configuration, HAL time base, newlib stubs)
# and the CubeIDE H747 startup file.
[[annotations]]
path = [
  "service-tool/Core/Inc/stm32h7xx_hal_conf.h",
  "service-tool/Core/Inc/stm32h7xx_it.h",
  "service-tool/Core/Src/stm32h7xx_hal_timebase_tim.c",
  "service-tool/Core/Src/stm32h7xx_it.c",
  "service-tool/Core/Src/syscalls.c",
  "service-tool/Core/Src/sysmem.c",
  "service-tool/Core/Src/system_stm32h7xx.c",
  "service-tool/Core/Startup/startup_stm32h747xihx.s",
]
precedence = "override"
SPDX-FileCopyrightText = "STMicroelectronics"
SPDX-License-Identifier = "BSD-3-Clause"

# Drivers/BSP/** -> BSD-3-Clause: the board and component configuration headers,
# which select which drivers and features the BSP compiles in.
[[annotations]]
path = "service-tool/Core/Inc/*_conf.h"
precedence = "override"
SPDX-FileCopyrightText = "STMicroelectronics"
SPDX-License-Identifier = "BSD-3-Clause"

# Drivers/CMSIS/Device/ST/STM32H7xx -> Apache-2.0. The H753 startup file is the
# CMSIS device template, NOT the CubeIDE one the H747 uses; they come from
# different trees under different licences, which is why the two startup files
# are annotated separately.
[[annotations]]
path = "service-tool/Core/Startup/startup_stm32h753xx.s"
precedence = "override"
SPDX-FileCopyrightText = "STMicroelectronics"
SPDX-License-Identifier = "Apache-2.0"

# LVGL configuration, from that project's lv_conf_template.h.
[[annotations]]
path = "service-tool/Core/Inc/lv_conf.h"
precedence = "override"
SPDX-FileCopyrightText = "LVGL Kft"
SPDX-License-Identifier = "MIT"

# The one file with no counterpart in the STM32CubeH7 distribution: emitted by
# the STM32CubeIDE generator, carrying ST's "terms in the LICENSE file" notice
# with no LICENSE file shipped. See LICENSES/LicenseRef-ST-CubeIDE-unstated.txt.
[[annotations]]
path = "service-tool/ldscripts/STM32H753XIHX_FLASH.ld"
precedence = "override"
SPDX-FileCopyrightText = "STMicroelectronics"
SPDX-License-Identifier = "LicenseRef-ST-CubeIDE-unstated"
