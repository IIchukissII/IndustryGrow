#
# Console-only TLS termination — the operator console and token API, and nothing
# else. Use this when the deployment has no operator CA yet.
#
# ADR-0024's ceremony is a deliberate, custody-critical act (decisions 5-7), and a
# deployment legitimately sits for a while with no CA: the ERP runs, an operator
# needs the console, and no gateway can authenticate yet because no gateway
# certificate exists. `deploy/mtls/nginx.conf` cannot serve that state — its
# gateway listener needs `operator-root.crt` to start, so a missing CA takes the
# console down with it. This config is that state made runnable.
#
# WHAT IT DELIBERATELY DOES NOT DO: the gateway channel. There is no client
# certificate verification here and no port 8443 — the routes return 403, exactly
# as they do on the console listener of the full config. When the operator CA
# exists, switch to `docker-compose.mtls.yml` and retire this.

events {}

http {
    default_type text/plain;

    upstream erp {
        server erp:8021;
    }

    server {
        listen 443 ssl;
        server_name industrygrow.local;

        # A self-signed leaf, not a chain from any CA — see deploy/console/make-cert.sh.
        # It protects the operator token in transit on the LAN, which is the whole
        # job here; it establishes no identity that anything else should trust.
        ssl_certificate     /etc/nginx/tls/console.crt;
        ssl_certificate_key /etc/nginx/tls/console.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # The gateway channel does not exist on this listener and must not appear
        # to: no client certificate is verified here, so no machine identity can be
        # established (ADR-0022 d2). Same refusal the full config gives on 443.
        location /api/v1/gateway/ {
            return 403 "gateway routes require mTLS, which this deployment has no CA for yet\n";
        }

        location / {
            proxy_pass http://erp;
            proxy_set_header Host $host;
            # This listener never authenticates a certificate, so it must never look
            # as though it did. Strip any client-supplied copies of the contract
            # headers the app reads (app/services/mtls.py).
            proxy_set_header X-Client-Verify "";
            proxy_set_header X-Client-DN "";
        }
    }
}
