<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-label="A01-THERMAL working principle">
  <title>A01-THERMAL — working principle</title>
  <desc>The gateway issues a signed demand with a validity deadline. The node conditions it and drives a current-mode buck and an H-bridge from the +24 V section. Three hardware interlocks — radiator, grow volume, coolant flow — gate the driver enable directly and cannot be overridden by firmware. The thermoelectric string sits between a finned exchanger in the grow volume and a water block in the rejection loop; the direction of heat flow follows the sign of the demand.</desc>

  <defs>
    <marker id="a31" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5F5E5A"/></marker>
    <marker id="a31s" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#D85A30"/></marker>
    <marker id="a31b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#7A8DA6"/></marker>
    <marker id="a31bs" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto"><path d="M6 0 L0 3 L6 6 Z" fill="#7A8DA6"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="469" rx="10" fill="#FFFFFF" stroke="#E5E3DC"/>
  <text x="360" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2C2C2A">A01-THERMAL — working principle</text>

  <!-- command band -->
  <rect x="32" y="50" width="170" height="40" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="117" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">Gateway</text>
  <text x="117" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">supervisory loop</text>

  <line x1="202" y1="70" x2="318" y2="70" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a31)"/>
  <text x="260" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">demand −1…+1 + deadline</text>

  <rect x="322" y="50" width="230" height="40" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="437" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">A01 node — E0011 on E0001</text>
  <text x="437" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">dead band · dwell · slew · fail-safe</text>

  <!-- node drives the two PWM stages -->
  <path d="M437 90 L437 104 L225 104 L225 118" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a31)"/>
  <path d="M437 104 L400 104 L400 118" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a31)"/>

  <!-- power band -->
  <rect x="24" y="122" width="104" height="44" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="76" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">+24 V</text>
  <text x="76" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">C5 module, 10 A</text>

  <line x1="128" y1="144" x2="146" y2="144" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a31)"/>

  <rect x="150" y="122" width="150" height="44" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="225" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">Buck — current mode</text>
  <text x="225" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">3.0 A limit · PWM_1</text>

  <line x1="300" y1="144" x2="326" y2="144" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a31)"/>

  <rect x="330" y="122" width="140" height="44" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="400" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">H-bridge — direction</text>
  <text x="400" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">PWM_2 · PWM_3</text>

  <!-- interlocks -->
  <rect x="540" y="112" width="152" height="28" rx="3" fill="#FDF3E7" stroke="#E0B080"/>
  <text x="616" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">T2 · radiator 80 °C</text>
  <rect x="540" y="146" width="152" height="28" rx="3" fill="#FDF3E7" stroke="#E0B080"/>
  <text x="616" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">T3 · grow volume 35 °C</text>
  <rect x="540" y="180" width="152" height="28" rx="3" fill="#FDF3E7" stroke="#E0B080"/>
  <text x="616" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2C2C2A">T4 · coolant flow</text>

  <path d="M540 126 L516 126 L516 194 L540 194" fill="none" stroke="#D85A30" stroke-width="1.2"/>
  <line x1="540" y1="160" x2="516" y2="160" stroke="#D85A30" stroke-width="1.2"/>
  <line x1="516" y1="144" x2="476" y2="144" stroke="#D85A30" stroke-width="1.4" marker-end="url(#a31s)"/>
  <text x="496" y="138" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#D85A30">enable</text>
  <text x="616" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">hardware — firmware cannot</text>
  <text x="616" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">override or re-arm</text>

  <!-- drive down to the string -->
  <line x1="400" y1="166" x2="400" y2="292" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a31)"/>

  <!-- thermal band -->
  <text x="360" y="272" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5F5E5A">heat path — direction follows the sign of the demand</text>

  <rect x="24" y="296" width="104" height="86" rx="4" fill="#EEF4EE" stroke="#A8C4A8"/>
  <text x="76" y="333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">GROW</text>
  <text x="76" y="347" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">VOLUME</text>

  <line x1="128" y1="339" x2="164" y2="339" stroke="#7A8DA6" stroke-width="1.4" marker-end="url(#a31b)" marker-start="url(#a31bs)"/>

  <rect x="168" y="310" width="112" height="58" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="224" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">Exchanger</text>
  <text x="224" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">+ fan</text>
  <text x="224" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">PWM_4</text>

  <line x1="280" y1="339" x2="341" y2="339" stroke="#7A8DA6" stroke-width="1.4" marker-end="url(#a31b)" marker-start="url(#a31bs)"/>

  <rect x="345" y="310" width="110" height="58" rx="4" fill="#FDF3E7" stroke="#E0B080"/>
  <text x="400" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">TEC × 4</text>
  <text x="400" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">series string</text>
  <text x="400" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">2.9 A · 70 W</text>

  <line x1="455" y1="339" x2="496" y2="339" stroke="#7A8DA6" stroke-width="1.4" marker-end="url(#a31b)" marker-start="url(#a31bs)"/>

  <rect x="500" y="310" width="110" height="58" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="555" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">Water block</text>
  <text x="555" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">+ loop</text>
  <text x="555" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">≥ 160 W</text>

  <line x1="610" y1="339" x2="642" y2="339" stroke="#7A8DA6" stroke-width="1.4" marker-end="url(#a31b)" marker-start="url(#a31bs)"/>

  <rect x="646" y="296" width="50" height="86" rx="4" fill="#EEF1F6" stroke="#C3CBD6"/>
  <text x="671" y="343" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">ROOM</text>

  <!-- interlock sensor locations -->
  <line x1="616" y1="208" x2="616" y2="296" stroke="#E0B080" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="428" y1="310" x2="428" y2="292" stroke="#E0B080" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">trips are analog + comparator · reported temperatures are DS18B20 on one 1-Wire bus</text>

  <!-- footer numbers -->
  <line x1="24" y1="420" x2="696" y2="420" stroke="#E5E3DC" stroke-width="1"/>
  <text x="360" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#5F5E5A">86 W pumped at ΔT 15 K · setpoints 20 °C day / 14 °C night · radiator ceiling 60 °C (PETG), hardware trip 80 °C</text>
  <text x="360" y="454" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">values marked verify in §3–§8 are not confirmed against a datasheet</text>
</svg>
