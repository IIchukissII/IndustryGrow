<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-label="E0012 tempering unit — clamped column and the circuits crossing to the node">
  <title>E0012 tempering unit — clamped column and boundary</title>
  <desc>A vertical section through the tempering unit. Grow-volume air is drawn from a floor intake, crosses the finned exchanger HX1 with its integral fan E2, and returns to the volume through a ceiling discharge slot. Below HX1 the two thermoelectric modules TEC1 and TEC2 form the series pair E1, cold face against HX1 and hot face against the water block WB1, which is also the clamping plate and carries the unit's coolant supply and return to the rejection loop. The three parts form one clamped column through disc springs; the printed housing surrounds the column and carries no part of the clamping load. Three sensing elements sit on the column: U2 on the HX1 base, U1 on WB1, and the trip element RT1 on WB1. Four circuits cross the boundary to the A01-CLIMATE node E0011 — the thermoelectric string, the fan drive, the shared 1-Wire line carrying U1 and U2, and the RT1 pair that feeds the node's rejection over-temperature comparator. The unit itself publishes nothing.</desc>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5F5E5A"/></marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#7A8DA6"/></marker>
    <marker id="ars" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#D85A30"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="779" height="429" rx="10" fill="#FFFFFF" stroke="#E5E3DC"/>
  <text x="390" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2C2C2A">E0012 tempering unit — clamped column and boundary</text>

  <!-- ============ grow volume ============ -->
  <rect x="22" y="52" width="196" height="290" rx="6" fill="#FBFBF9" stroke="#C9C6BC"/>
  <text x="36" y="70" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">GROW VOLUME</text>
  <text x="36" y="86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">not this unit — enclosure, O-107</text>

  <line x1="218" y1="118" x2="262" y2="118" stroke="#7A8DA6" stroke-width="1.2" marker-end="url(#arb)"/>
  <text x="240" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">intake</text>
  <text x="240" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">at the floor</text>

  <line x1="262" y1="170" x2="218" y2="170" stroke="#7A8DA6" stroke-width="1.2" marker-end="url(#arb)"/>
  <text x="240" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">discharge</text>
  <text x="240" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">slot, M5</text>

  <!-- ============ the unit ============ -->
  <rect x="262" y="52" width="248" height="290" rx="6" fill="#FFFFFF" stroke="#C9C6BC" stroke-dasharray="4 3"/>
  <text x="276" y="70" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">E0012 — printed housing, M4</text>

  <text x="386" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">clamped column, M1 — disc springs; the housing carries no clamping load</text>

  <path d="M300 96 L300 108" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M472 96 L472 108" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="278" y="110" width="216" height="56" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="386" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">HX1 + E2 fan</text>
  <text x="386" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">base temperature at U2</text>
  <text x="386" y="156" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#7A8DA6">above dew point — no condensate, T2</text>

  <rect x="278" y="176" width="216" height="42" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="386" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">TEC1, TEC2 — E1 series pair</text>
  <text x="386" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">cold face to HX1 · hot face to WB1</text>

  <rect x="278" y="228" width="216" height="56" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="386" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">WB1 water block</text>
  <text x="386" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">clamping plate · block temperature at U1</text>
  <text x="386" y="274" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#D85A30">RT1 — trip element, T4</text>

  <path d="M300 298 L300 286" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M472 298 L472 286" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ============ boundary ============ -->
  <line x1="530" y1="52" x2="530" y2="410" stroke="#C9C6BC" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="536" y="66" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">E-number boundary</text>

  <!-- ============ node ============ -->
  <rect x="566" y="82" width="190" height="150" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="661" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2C2C2A">A01-CLIMATE node</text>
  <text x="661" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">E0011</text>
  <text x="661" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">U5 drives the string</text>
  <text x="661" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">U9 drives the fan</text>
  <text x="661" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">U7 compares RT1</text>
  <text x="661" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#D85A30">U1 derates both tracts</text>
  <text x="661" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#D85A30">RT1 trips both drivers</text>

  <line x1="494" y1="120" x2="562" y2="120" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="528" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">1-Wire</text>

  <line x1="494" y1="196" x2="562" y2="196" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="528" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">E1 string</text>

  <path d="M494 256 L562 256 L562 232" fill="none" stroke="#D85A30" stroke-width="1.2" marker-end="url(#ars)"/>
  <text x="520" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#D85A30">RT1 pair</text>

  <text x="536" y="286" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">E2 fan drive on the same harness</text>
  <text x="536" y="298" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5F5E5A">connector unspecified — O-126</text>

  <!-- ============ rejection loop ============ -->
  <rect x="566" y="330" width="190" height="62" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
  <text x="661" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2C2C2A">rejection loop</text>
  <text x="661" y="364" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">supply and return at WB1</text>
  <text x="661" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5F5E5A">purchase deferred — ADR-0032</text>

  <path d="M440 284 L440 360 L562 360" fill="none" stroke="#7A8DA6" stroke-width="1.2" marker-end="url(#arb)"/>
  <path d="M562 344 L410 344 L410 284" fill="none" stroke="#7A8DA6" stroke-width="1.2" marker-end="url(#arb)"/>
  <text x="360" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#7A8DA6">two wet joints, M6</text>
</svg>
